[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workout-plan-generator"
version = "0.4.2"
description = "Offline-first desktop tool that generates personalized workout plans from a short intake form."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-workout-plan-generator contributors" }]
keywords = ["fitness", "workout", "planner", "desktop", "offline", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Health/Medical :: Fitness",
]
dependencies = [
  "PySide6>=6.7,<7",
  "pydantic>=2.6,<3",
  "tomli-w>=1.0",
  "platformdirs>=4.2",
  "onnxruntime>=1.18,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-qt>=4.4",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]

[project.scripts]
ai-workout-plan-generator = "app.bootstrap:main"

[project.gui-scripts]
ai-workout-plan-generator-gui = "app.bootstrap:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "handlers*", "services*", "models*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"